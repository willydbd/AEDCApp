<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>AEDC App</title>
    <meta name="author"
          content="Banjo Mofesola Paul | Oluwagbuyi Abimbola | Adegoke Oluwatoyin, Planet Nest">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/superhero.bootstrap.css"/>

    <!-- Animate CSS -->
    <link rel="stylesheet" href="css/animate.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"/>

    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="font-awesome-4.4.0/css/font-awesome.min.css"/>


    <!-- jQuery JS -->
    <script src="js/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.min.js"></script>

    <!-- Knockout JS -->
    <script src="js/ko.min.js"></script>
    <script src="js/knockout.mapping.js"></script>

    <!-- Custom script -->
    <script>var app_where = 'topup'</script>
    <script src="js/script.js"></script>
</head>
<body>
<nav class="navbar navbar-default animated fadeInDown">
    <div class="container-fluid">
        <div class="navbar-header">
            <div class="navbar-brand">AEDC - Topup</div>
        </div>
        <div style="color: #ccc" data-bind="text: company"></div>
    </div>
</nav>
<section class="container-fluid top-up-fields animated fadeIn">

    <form class="form top-up-form-fields" data-bind="submit: topup_submit">
        <div class="form-group">
            <label style="color: #ccc" class="control-label" data-bind="visible: card_number() != ''">Debit Card Number</label>
            <input type="text" class="form-control has-user-select" placeholder="Debit Card number..." maxlength="16"
                   data-bind="value: card_number, textInput: card_number, value_update: 'input'"/>
        </div>
        <div class="form-group">
            <label style="color: #ccc" class="control-label" data-bind="visible: cvv2() != ''">CVV2</label>
            <div class="input-group">
                <input type="password" class="form-control password has-user-select" maxlength="3" placeholder="CVV2..."
                       data-bind="value: cvv2, textInput: cvv2, value_update: 'input'" />
                <a class="btn btn-default input-group-addon"><span class="fa fa-eye-slash"></span></a>
            </div>
            <label style="color: #ccc" class="control-label" data-bind="visible: !cvv2_valid()">CVV2 can only be numbers</label>
        </div>
        <div class="form-group">
            <label style="color: #ccc" class="control-label" data-bind="visible: pin() != ''">PIN</label>
            <div class="input-group">
                <input type="password" class="form-control password has-user-select" maxlength="4" placeholder="PIN..."
                       data-bind="value: pin, textInput: pin, value_update: 'input'" />
                <a class="btn btn-default input-group-addon"><span class="fa fa-eye-slash"></span></a>
            </div>
            <label style="color: #ccc" class="control-label" data-bind="visible: !pin_valid()">PIN can only be numbers</label>
        </div>
        <div class="form-group">
            <label style="color: #ccc" class="control-label" data-bind="visible: amt() != ''">Amount</label>
            <label style="color: #fff" class="control-label pull-right" data-bind="visible: kwh() != ''">
                <span data-bind="text: kwh"></span> kwh</label>
            <div class="clearfix"></div>
            <input type="number" min="0" class="form-control has-user-select" placeholder="Amount (&#8358;)..."
                   data-bind="value: amt, textInput: amt, value_update: 'input'"/>
            <label style="color: #ccc" class="control-label" data-bind="visible: !amt_valid()">Amount can only be numbers</label>
        </div>
        <div class="form-group">
            <label style="color: #ccc" class="control-label" data-bind="visible: serial() != ''">Prepad Serial Number</label>
            <input type="text" class="form-control has-user-select" placeholder="Prepaid Serial Number..." maxlength="20"
                   data-bind="value: serial, textInput: serial, value_update: 'input'"/>
        </div>
        <div class="form-group">
            <input type="submit" class="btn btn-primary text-uppercase" value="Top up">
        </div>
    </form>

</section>
</body>
</html>
